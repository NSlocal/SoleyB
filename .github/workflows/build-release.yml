name: Build & Release Solely Browser
run-name: SoleyB 🚀 ${{ github.ref_name }}

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Execute Permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1
          echo "EXIT CODE: $?"

      - name: Show APK Location
        run: |
          echo "=== Mencari file APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "Tidak ada APK ditemukan"
          echo "=== Folder release ==="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Folder release tidak ada"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolelyBrowser-v1.0.36
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          
