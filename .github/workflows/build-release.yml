name: Build & Release Solely Browser
run-name: Solely API34+ 🚀 ${{ github.ref_name }}

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Execute Permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solely-browser-api34-arm64-v1.0.36
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Solely Browser ${{ github.ref_name }}
          body: |
            ✅ **Solely Browser — Full Release**
            • Min SDK: 34 (Android 14+)
            • Target SDK: 36 (Android 15)
            • Arch: arm64-v8a only
            • Size: ~2.7 MB
            • Languages: English + Bahasa Indonesia
            • `solely://flags` — HTTPS/TLS controls
            • Fully Open Source
