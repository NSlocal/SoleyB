name: Build & Release Solely Browser
run-name: SoleyB Signed 🚀 ${{ github.ref_name }}

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Execute Permission
        run: chmod +x gradlew

      # ✅ SIGNING CONFIG — Add to build.gradle or here
      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          fi

      - name: Build Signed Release APK
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon \
          -PkeystoreFile=keystore.jks \
          -PkeystorePassword="$STORE_PASSWORD" \
          -PkeyAlias="$KEY_ALIAS" \
          -PkeyPassword="$KEY_PASSWORD"

      - name: Show APK Location
        run: find . -name "*.apk" -type f

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoleyB-Signed-API34
          path: app/build/outputs/apk/release/*.apk
