buildscript {
    ext {
        compileSdk = 36
        minSdk = 24
        targetSdk = 36
        versionCode = 1036
        versionName = "1.0.36"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.5.0"
    }
}
